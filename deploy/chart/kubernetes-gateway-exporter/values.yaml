replicaCount: 1

image:
  repository: ghcr.io/tokanize/kubernetes-gateway-exporter
  pullPolicy: IfNotPresent
  # tag defaults to "" so the deployment template falls back to .Chart.AppVersion,
  # which matches the release tag scheme (e.g. "0.1.0").
  tag: ""
  # When set, digest takes precedence over tag and renders repository@digest.
  digest: ""

serviceAccount:
  create: true
  name: "gateway-exporter-sa"
  annotations: {}

networkPolicy:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

config:
  enableOtel: "false"

serviceMonitor:
  enabled: true
  interval: 15s

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

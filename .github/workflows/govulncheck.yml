name: govulncheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly on Monday at 03:45 UTC
    - cron: '45 3 * * 1'
  workflow_dispatch:

# govulncheck only reads the repository and Go module graph — no elevated
# permissions are needed, so the least-privilege default is sufficient.
permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      # govulncheck reports only vulnerabilities reachable from the compiled
      # call graph, which makes it low-noise relative to a raw dep-tree scan.
      # This step is intentionally BLOCKING: a found vulnerability fails the job.
      # Pin the scanner implementation for reproducibility. The vulnerability
      # database remains current independently of the CLI version.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

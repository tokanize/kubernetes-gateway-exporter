name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly on Monday at 03:27 UTC — offset from the hour to spread load on GitHub runners
    - cron: '27 3 * * 1'
  workflow_dispatch:

# Least-privilege default: all jobs start with read-only token
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest

    permissions:
      # Required to upload SARIF results to the Code scanning dashboard
      security-events: write
      # Required for workflows in private repositories to read action metadata
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Set up the correct Go toolchain before CodeQL autobuild so the module
      # cache and build constraints match the project's go.mod toolchain directive.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: go

      # autobuild runs `go build ./...` and falls back to a best-effort heuristic;
      # explicit setup-go above ensures it picks up the right toolchain version.
      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4

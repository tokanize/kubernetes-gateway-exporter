name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly on Monday at 03:27 UTC — offset from the hour to spread load on GitHub runners
    - cron: '27 3 * * 1'
  workflow_dispatch:

# Least-privilege default: all jobs start with read-only token
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest

    permissions:
      # Required to upload SARIF results to the Code scanning dashboard
      security-events: write
      # Required for workflows in private repositories to read action metadata
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # Set up the correct Go toolchain before CodeQL autobuild so the module
      # cache and build constraints match the project's go.mod toolchain directive.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: go

      # autobuild runs `go build ./...` and falls back to a best-effort heuristic;
      # explicit setup-go above ensures it picks up the right toolchain version.
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

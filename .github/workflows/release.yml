name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least-privilege baseline: all jobs override permissions explicitly.
permissions:
  contents: read

# Prevent concurrent releases for the same ref, but never cancel an in-flight
# release publish (cancel-in-progress: false) to avoid partial releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job A: Build, push, sign, SBOM, and attest the container image.
  # ---------------------------------------------------------------------------
  image:
    name: Build, push & sign image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # cosign keyless signing + GitHub OIDC for provenance
      attestations: write   # store GitHub Artifact Attestations

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Run tests as a release gate: fail early before we publish anything.
      - name: Run tests
        run: go test ./...

      # QEMU allows the buildx builder to emulate non-native architectures
      # (e.g. arm64 on an amd64 GitHub-hosted runner).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produce a rich set of tags:
      #   - semver (0.1.0)
      #   - major.minor (0.1)
      #   - git SHA (for precise pinning)
      #   - latest (only for non-prerelease tags, i.e. tags without a hyphen)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tokanize/kubernetes-gateway-exporter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Build and push a multi-arch image.
      # provenance: false — we disable buildx's embedded provenance here because
      # it produces an image-index manifest that is difficult to verify
      # independently.  We attach a proper, verifiable GitHub Artifact
      # Attestation in the step below instead.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Sign by digest rather than a mutable tag so the signature is
      # permanently bound to the exact image content.
      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/tokanize/kubernetes-gateway-exporter@${{ steps.build.outputs.digest }}

      # Generate an SPDX SBOM for the pushed image. The artifact is uploaded
      # here and attached to the GitHub Release in the release job.
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/tokanize/kubernetes-gateway-exporter@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-image.spdx.json
          upload-artifact: false   # we upload manually below for explicit naming

      - name: Upload image SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-image
          path: sbom-image.spdx.json

      # Attach a GitHub Artifact Attestation to the image.  This produces a
      # cryptographically verifiable build-provenance record backed by Sigstore
      # and GitHub's OIDC token — no external key material required.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/tokanize/kubernetes-gateway-exporter
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write summary
        run: |
          echo "## Container image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Full ref:** \`ghcr.io/tokanize/kubernetes-gateway-exporter@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify with: \`cosign verify ghcr.io/tokanize/kubernetes-gateway-exporter@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job B: Cross-compile static binaries, sign checksums, generate source SBOM.
  # ---------------------------------------------------------------------------
  binaries:
    name: Build, sign & attest binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # cosign keyless + provenance OIDC
      attestations: write   # GitHub Artifact Attestations for binaries

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Build static binaries for all target platforms.
      # NOTE: main.go does not declare a `var version`, so we omit -X ldflags.
      # CGO_ENABLED=0 ensures fully static binaries compatible with distroless
      # and Alpine-based images without libc assumptions.
      - name: Build binaries
        run: |
          VERSION="${{ github.ref_name }}"
          declare -A targets=(
            ["linux/amd64"]="linux_amd64"
            ["linux/arm64"]="linux_arm64"
            ["darwin/amd64"]="darwin_amd64"
            ["darwin/arm64"]="darwin_arm64"
          )
          mkdir -p dist
          for platform in "${!targets[@]}"; do
            OS="${platform%/*}"
            ARCH="${platform#*/}"
            SUFFIX="${targets[$platform]}"
            BINARY="exporter_${SUFFIX}"
            echo "Building ${BINARY}..."
            CGO_ENABLED=0 GOOS="${OS}" GOARCH="${ARCH}" \
              go build -ldflags="-w -s" \
              -o "dist/${BINARY}" ./cmd/exporter
            ARCHIVE="kubernetes-gateway-exporter_${VERSION}_${SUFFIX}.tar.gz"
            tar -czf "dist/${ARCHIVE}" \
              -C dist "${BINARY}" \
              -C "${{ github.workspace }}" LICENSE README.md
            echo "  -> dist/${ARCHIVE}"
          done

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum kubernetes-gateway-exporter_*.tar.gz > checksums.txt
          echo "Checksums:"
          cat checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Sign the checksums file as a blob using keyless Sigstore signing.
      # Consumers can verify any binary by: checking its SHA-256 against
      # checksums.txt, then verifying checksums.txt.sig + checksums.txt.pem
      # with cosign verify-blob.
      - name: Sign checksums (keyless)
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      # Generate an SPDX SBOM for the Go module / source tree.
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          upload-artifact: false

      - name: Move source SBOM into dist
        run: mv sbom-source.spdx.json dist/

      # Attest build provenance for the binary archives so downstream consumers
      # can verify which commit and workflow produced each release asset.
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/kubernetes-gateway-exporter_*.tar.gz

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/kubernetes-gateway-exporter_*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/sbom-source.spdx.json

  # ---------------------------------------------------------------------------
  # Job C: Package, push, sign and attest the Helm chart as an OCI artifact.
  # ---------------------------------------------------------------------------
  chart:
    name: Package, push & sign Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push chart to GHCR as an OCI artifact
      id-token: write       # cosign keyless + provenance OIDC
      attestations: write   # GitHub Artifact Attestation for the chart

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (Helm OCI registry)
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}"

      # Override chart version + appVersion with the release tag (strip leading
      # 'v') so the published chart version always tracks the release.
      - name: Package and push chart
        id: push
        run: |
          VERSION="${{ github.ref_name }}"
          CHART_VERSION="${VERSION#v}"
          helm package deploy/chart/kubernetes-gateway-exporter \
            --version "${CHART_VERSION}" --app-version "${CHART_VERSION}"
          helm push "kubernetes-gateway-exporter-${CHART_VERSION}.tgz" \
            oci://ghcr.io/tokanize/charts 2>&1 | tee push.log
          DIGEST=$(grep -oE 'sha256:[a-f0-9]+' push.log | head -1)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Chart digest: ${DIGEST}"

      # Sign the chart by digest (immutable), same keyless flow as the image.
      - name: Sign chart (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/tokanize/charts/kubernetes-gateway-exporter@${{ steps.push.outputs.digest }}

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/tokanize/charts/kubernetes-gateway-exporter
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Write summary
        run: |
          {
            echo "## Helm chart published"
            echo ""
            echo "\`oci://ghcr.io/tokanize/charts/kubernetes-gateway-exporter\` @ \`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo "Install: \`helm install gateway-exporter oci://ghcr.io/tokanize/charts/kubernetes-gateway-exporter --version ${GITHUB_REF_NAME#v}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job D: Create the GitHub Release and attach all assets.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [image, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create release + upload assets

    steps:
      - name: Download release artifacts (binaries job)
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-assets

      - name: Download image SBOM (image job)
        uses: actions/download-artifact@v4
        with:
          name: sbom-image
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tags containing a hyphen (e.g. v0.1.0-rc1) are marked as prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/kubernetes-gateway-exporter_*.tar.gz
            release-assets/checksums.txt
            release-assets/checksums.txt.sig
            release-assets/checksums.txt.pem
            release-assets/sbom-image.spdx.json
            release-assets/sbom-source.spdx.json
          body: |
            ## kubernetes-gateway-exporter ${{ github.ref_name }}

            ### Container image

            ```
            ghcr.io/tokanize/kubernetes-gateway-exporter@${{ needs.image.outputs.digest }}
            ```

            The image is also available via the semver tag:
            ```
            ghcr.io/tokanize/kubernetes-gateway-exporter:${{ github.ref_name }}
            ```

            ### Supply-chain security

            **Image signing** — The container image is signed with [Sigstore cosign](https://docs.sigstore.dev/) using keyless (OIDC-based) signing. Verify with:
            ```
            cosign verify \
              --certificate-identity-regexp "https://github.com/tokanize/kubernetes-gateway-exporter" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ghcr.io/tokanize/kubernetes-gateway-exporter@${{ needs.image.outputs.digest }}
            ```

            **Build provenance attestation** — A build-provenance attestation (SLSA-style provenance) for both the container image and the binary archives is stored via [GitHub Artifact Attestations](https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds). Verify with:
            ```
            gh attestation verify \
              oci://ghcr.io/tokanize/kubernetes-gateway-exporter@${{ needs.image.outputs.digest }} \
              --owner tokanize
            ```

            **Checksums** — SHA-256 checksums for all binary archives are in `checksums.txt`. The checksums file itself is signed with cosign keyless (`checksums.txt.sig` + `checksums.txt.pem`). cosign v2 requires the signer identity, so verify with:
            ```
            cosign verify-blob \
              --certificate-identity-regexp "https://github.com/tokanize/kubernetes-gateway-exporter" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --signature checksums.txt.sig \
              --certificate checksums.txt.pem \
              checksums.txt
            ```

            **SBOMs** — SPDX JSON software bills of materials are attached for both the container image (`sbom-image.spdx.json`) and the Go module source tree (`sbom-source.spdx.json`).

            > Note: This release makes no specific SLSA level claim. The above attestations are generated by GitHub Actions using Sigstore keyless signing.

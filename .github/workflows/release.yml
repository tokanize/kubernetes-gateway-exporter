name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least-privilege baseline: all jobs override permissions explicitly.
permissions:
  contents: read

# Prevent concurrent releases for the same ref, but never cancel an in-flight
# release publish (cancel-in-progress: false) to avoid partial releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job A: Re-run every release gate before publishing any artifact.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Validate release ref
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release workflow requires a semantic v-prefixed tag, got: $GITHUB_REF" >&2
            exit 1
          fi

      - name: Run source validation
        run: |
          make fmt-check
          make vet
          make staticcheck
          make tidy-check
          make test
          make helm-lint

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

      - name: Trivy repository gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # ---------------------------------------------------------------------------
  # Job B: Build, scan, promote, sign, SBOM, and attest the container image.
  # ---------------------------------------------------------------------------
  image:
    name: Build, push & sign image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # cosign keyless signing + GitHub OIDC for provenance
      attestations: write   # store GitHub Artifact Attestations

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      # QEMU allows the buildx builder to emulate non-native architectures
      # (e.g. arm64 on an amd64 GitHub-hosted runner).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produce a rich set of tags:
      #   - semver (0.1.0)
      #   - major.minor (0.1)
      #   - git SHA (for precise pinning)
      #   - latest (only for non-prerelease tags, i.e. tags without a hyphen)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/tokanize/kubernetes-gateway-exporter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Build the multi-arch image once and push it under a quarantine-only tag.
      # Release aliases are assigned to the exact digest only after the scan.
      # provenance: false — we disable buildx's embedded provenance here because
      # it produces an image-index manifest that is difficult to verify
      # independently.  We attach a proper, verifiable GitHub Artifact
      # Attestation in the step below instead.
      - name: Build and push quarantine image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/tokanize/kubernetes-gateway-exporter:quarantine-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Trivy quarantine image gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/tokanize/kubernetes-gateway-exporter@${{ steps.build.outputs.digest }}
          format: table
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Promote scanned digest to release tags
        env:
          IMAGE: ghcr.io/tokanize/kubernetes-gateway-exporter
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            [[ -n "$tag" ]] && tag_args+=(--tag "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "${IMAGE}@${DIGEST}"

          for tag in "${tags[@]}"; do
            [[ -z "$tag" ]] && continue
            promoted_digest=$(docker buildx imagetools inspect "$tag" \
              --format '{{json .}}' | jq -r '.manifest.digest')
            if [[ "$promoted_digest" != "$DIGEST" ]]; then
              echo "Promoted tag $tag resolved to $promoted_digest, expected $DIGEST" >&2
              exit 1
            fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign by digest rather than a mutable tag so the signature is
      # permanently bound to the exact image content.
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/tokanize/kubernetes-gateway-exporter@${DIGEST}"

      # Generate an SPDX SBOM for the pushed image. The artifact is uploaded
      # here and attached to the GitHub Release in the release job.
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/tokanize/kubernetes-gateway-exporter@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-image.spdx.json
          upload-artifact: false   # we upload manually below for explicit naming

      - name: Upload image SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-image
          path: sbom-image.spdx.json

      - name: Attest image SBOM provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: sbom-image.spdx.json

      # Attach a GitHub Artifact Attestation to the image.  This produces a
      # cryptographically verifiable build-provenance record backed by Sigstore
      # and GitHub's OIDC token — no external key material required.
      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/tokanize/kubernetes-gateway-exporter
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Re-check the promoted digest. This catches registry/tagging mistakes and
      # proves the public release aliases still resolve to the scanned content.
      - name: Trivy promoted image verification
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/tokanize/kubernetes-gateway-exporter@${{ steps.build.outputs.digest }}
          format: table
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Write summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Container image published"
            echo ""
            echo "**Digest:** \`${DIGEST}\`"
            echo ""
            echo "**Full ref:** \`ghcr.io/tokanize/kubernetes-gateway-exporter@${DIGEST}\`"
            echo ""
            echo "Verify with: \`cosign verify ghcr.io/tokanize/kubernetes-gateway-exporter@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job C: Cross-compile static binaries and generate the source SBOM.
  # ---------------------------------------------------------------------------
  binaries:
    name: Build & attest binaries
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # cosign keyless + provenance OIDC
      attestations: write   # GitHub Artifact Attestations for binaries

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: false

      # Build static binaries for all target platforms.
      # NOTE: main.go does not declare a `var version`, so we omit -X ldflags.
      # CGO_ENABLED=0 ensures fully static binaries compatible with distroless
      # and Alpine-based images without libc assumptions.
      - name: Build binaries
        run: |
          VERSION="$GITHUB_REF_NAME"
          declare -A targets=(
            ["linux/amd64"]="linux_amd64"
            ["linux/arm64"]="linux_arm64"
            ["darwin/amd64"]="darwin_amd64"
            ["darwin/arm64"]="darwin_arm64"
          )
          mkdir -p dist
          for platform in "${!targets[@]}"; do
            OS="${platform%/*}"
            ARCH="${platform#*/}"
            SUFFIX="${targets[$platform]}"
            BINARY="exporter_${SUFFIX}"
            echo "Building ${BINARY}..."
            CGO_ENABLED=0 GOOS="${OS}" GOARCH="${ARCH}" \
              go build -ldflags="-w -s" \
              -o "dist/${BINARY}" ./cmd/exporter
            ARCHIVE="kubernetes-gateway-exporter_${VERSION}_${SUFFIX}.tar.gz"
            tar -czf "dist/${ARCHIVE}" \
              -C dist "${BINARY}" \
              -C "${{ github.workspace }}" LICENSE README.md
            echo "  -> dist/${ARCHIVE}"
          done

      # Generate an SPDX SBOM for the Go module / source tree.
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          upload-artifact: false

      - name: Move source SBOM into dist
        run: mv sbom-source.spdx.json dist/

      # Attest build provenance for the binary archives so downstream consumers
      # can verify which commit and workflow produced each release asset.
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: dist/kubernetes-gateway-exporter_*.tar.gz

      - name: Attest source SBOM provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: dist/sbom-source.spdx.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: |
            dist/kubernetes-gateway-exporter_*.tar.gz
            dist/sbom-source.spdx.json

  # ---------------------------------------------------------------------------
  # Job D: Package, push, sign and attest the Helm chart as an OCI artifact.
  # ---------------------------------------------------------------------------
  chart:
    name: Package, push & sign Helm chart
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push chart to GHCR as an OCI artifact
      id-token: write       # cosign keyless + provenance OIDC
      attestations: write   # GitHub Artifact Attestation for the chart

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (Helm OCI registry)
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io \
            --username "$GHCR_USERNAME" \
            --password "$GHCR_PASSWORD"

      # Override chart version + appVersion with the release tag (strip leading
      # 'v') so the published chart version always tracks the release.
      - name: Package and push chart
        id: push
        run: |
          VERSION="$GITHUB_REF_NAME"
          CHART_VERSION="${VERSION#v}"
          helm package deploy/chart/kubernetes-gateway-exporter \
            --version "${CHART_VERSION}" --app-version "${CHART_VERSION}"
          helm push "kubernetes-gateway-exporter-${CHART_VERSION}.tgz" \
            oci://ghcr.io/tokanize/charts 2>&1 | tee push.log
          DIGEST=$(grep -oE 'sha256:[a-f0-9]+' push.log | head -1)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Chart digest: ${DIGEST}"

      # Sign the chart by digest (immutable), same keyless flow as the image.
      - name: Sign chart (keyless)
        env:
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "ghcr.io/tokanize/charts/kubernetes-gateway-exporter@${CHART_DIGEST}"

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/tokanize/charts/kubernetes-gateway-exporter
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Write summary
        env:
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Helm chart published"
            echo ""
            echo "\`oci://ghcr.io/tokanize/charts/kubernetes-gateway-exporter\` @ \`${CHART_DIGEST}\`"
            echo ""
            echo "Install: \`helm install gateway-exporter oci://ghcr.io/tokanize/charts/kubernetes-gateway-exporter --version ${GITHUB_REF_NAME#v}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job E: Sign the complete artifact set and publish the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [image, binaries, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create release + upload assets
      id-token: write   # cosign keyless signature for the final checksum file

    steps:
      - name: Download release artifacts (binaries job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: release-assets

      - name: Download image SBOM (image job)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom-image
          path: release-assets

      - name: Generate final checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign final checksums (keyless)
        working-directory: release-assets
        run: |
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          SOURCE_DIGEST: ${{ github.sha }}
        run: |
          cat > release-notes.md <<EOF
          ## kubernetes-gateway-exporter ${GITHUB_REF_NAME}

          ### Container image

          \`\`\`
          ghcr.io/tokanize/kubernetes-gateway-exporter@${IMAGE_DIGEST}
          \`\`\`

          The image is also available via the semver tag:
          \`\`\`
          ghcr.io/tokanize/kubernetes-gateway-exporter:${GITHUB_REF_NAME}
          \`\`\`

          ### Supply-chain security

          **Image signing** — The image is signed with Sigstore cosign using GitHub OIDC. Verify with:
          \`\`\`
          cosign verify \\
            --certificate-identity "https://github.com/tokanize/kubernetes-gateway-exporter/.github/workflows/release.yml@${GITHUB_REF}" \\
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\
            ghcr.io/tokanize/kubernetes-gateway-exporter@${IMAGE_DIGEST}
          \`\`\`

          **Build provenance** — Attestations cover the image, chart, binary archives, and SBOMs. Verify the image against this exact release source with:
          \`\`\`
          gh attestation verify \\
            oci://ghcr.io/tokanize/kubernetes-gateway-exporter@${IMAGE_DIGEST} \\
            --repo tokanize/kubernetes-gateway-exporter \\
            --signer-workflow tokanize/kubernetes-gateway-exporter/.github/workflows/release.yml \\
            --source-ref ${GITHUB_REF} \\
            --source-digest ${SOURCE_DIGEST}
          \`\`\`

          **Checksums** — \`checksums.txt\` covers every binary archive and both SBOMs and is signed with cosign keyless signing.

          **SBOMs** — SPDX JSON SBOMs are attached for the image and source tree, covered by the signed checksum manifest, and separately attested.

          > This release makes no specific SLSA level claim. Signatures and attestations establish origin and integrity, not vulnerability-free software.
          EOF

          prerelease_args=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease_args+=(--prerelease)

          gh release create "$GITHUB_REF_NAME" \
            release-assets/kubernetes-gateway-exporter_*.tar.gz \
            release-assets/checksums.txt \
            release-assets/checksums.txt.sig \
            release-assets/checksums.txt.pem \
            release-assets/sbom-image.spdx.json \
            release-assets/sbom-source.spdx.json \
            --verify-tag \
            --title "kubernetes-gateway-exporter ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${prerelease_args[@]}"

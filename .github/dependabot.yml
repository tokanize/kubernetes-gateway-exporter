# Dependabot keeps version-tag-pinned GitHub Actions and base images current,
# complementing the explicit version-tag pinning strategy documented in
# docs/security-scanning.md. Weekly cadence balances freshness against PR noise.
#
# `groups` collapse all updates within an ecosystem into a single PR per run,
# so an action/dependency bump wave arrives as one reviewable PR, not dozens.
version: 2

updates:
  # Go module dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      go-modules:
        patterns: ["*"]

  # GitHub Actions (keeps action version tags and SHA pins current)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  # Docker base images in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
